# Cluster-internal Service in front of the gateway pods. Exposing it beyond the
# cluster (an ingress, a load balancer) is left to the cluster's owner; for a
# test, use `kubectl port-forward` (README).
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: "${NAMESPACE}"
  labels:
    app.kubernetes.io/name: litellm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 4000
      targetPort: http
