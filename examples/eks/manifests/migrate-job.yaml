# One-off schema migration, the equivalent of the ECS migration task: same
# image, environment and config as deployment.yaml, schema updates on, and
# --skip_server_startup so LiteLLM migrates and exits. scripts/deploy.sh runs
# it before every rollout and applies the Deployment only if it completes.
# The quoted placeholders are filled in by scripts/render.py.
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-migrate
  namespace: "${NAMESPACE}"
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 0 # one attempt, as on ECS; a failure stops the rollout
  activeDeadlineSeconds: 1200 # the ECS migration wait limit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: "${SERVICE_ACCOUNT}"
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: "${IMAGE}"
          args: ["--port", "4000", "--config", "/etc/litellm/config.yaml", "--skip_server_startup"]
          env:
            - name: LITELLM_LOG
              value: "INFO"
            - name: JSON_LOGS
              value: "True"
            - name: LITELLM_CONFIG_SHA
              value: "${CONFIG_SHA}"
            - name: UI_USERNAME
              value: "admin"
            - name: REDIS_HOST
              value: "${REDIS_HOST}"
            - name: REDIS_PORT
              value: "${REDIS_PORT}"
            - name: REDIS_SSL
              value: "True"
            - name: DISABLE_SCHEMA_UPDATE
              value: "false" # the one difference from the Deployment
            - name: LITELLM_LOCAL_MODEL_COST_MAP
              value: "True"
            - name: KEEPALIVE_TIMEOUT
              value: "605"
            - name: AWS_REGION
              value: "${AWS_REGION}"
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: DATABASE_URL } }
            - name: LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: LITELLM_MASTER_KEY } }
            - name: LITELLM_SALT_KEY
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: LITELLM_SALT_KEY } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: REDIS_PASSWORD } }
            - name: UI_PASSWORD
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: UI_PASSWORD } }
          # The ECS migration task size (1 vCPU, 2 GiB).
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: "${CONFIG_MAP}"
